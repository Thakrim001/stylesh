/* ===== v2 refresh: palettes, cleaner components ===== */
:root{--te:#2cc4d6;--r:26px}

[data-pal=ocean]{--pk:#0ea5e9;--or:#22d3ee;--pu:#6366f1;--te:#2dd4bf;--br:linear-gradient(120deg,#0ea5e9,#6366f1);--bgA:#eaf6ff;--bgB:#eef0ff;--bgC:#e6fffb}
[data-pal=jade]{--pk:#10b981;--or:#d4a017;--pu:#0f766e;--te:#34d399;--br:linear-gradient(120deg,#10b981,#0f766e 60%,#d4a017);--bgA:#ecfdf5;--bgB:#f0fdfa;--bgC:#fffbeb}
[data-pal=noir]{--pk:#d4a017;--or:#f5d76e;--pu:#8b5cf6;--te:#fde68a;--br:linear-gradient(120deg,#b8860b,#f5d76e 55%,#d4a017);--bgA:#faf7f0;--bgB:#f4efe3;--bgC:#fff9e6}
[data-theme=dark][data-pal=rose]{--bgA:#1f0a12;--bgB:#2a0f1e;--bgC:#25120a}
[data-theme=dark][data-pal=ocean]{--bgA:#06121f;--bgB:#0a1730;--bgC:#031f26}
[data-theme=dark][data-pal=jade]{--bgA:#04150f;--bgB:#082418;--bgC:#1a1405}

[data-pal=noir] .btn:not(.s),[data-pal=noir] .tabs button.on,[data-pal=noir] .seg button.on{color:#1a1200}
.inv{--pk:#e91e8c;--or:#ff6a2b;--pu:#7b3fbf;--br:linear-gradient(120deg,#e91e8c,#ff6a2b 45%,#7b3fbf)}
body{letter-spacing:-.005em}

.g{border-radius:var(--r);padding:20px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 14px 44px -12px rgba(60,30,110,.22);border-color:rgba(255,255,255,.65)}

.gal{gap:12px;margin:0 -4px 14px;padding:0 4px}

.o{border-left:4px solid var(--pk);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.o:active{transform:scale(.985)}

.sw.pal{width:34px}

.sw.pal:active .dot{transform:rotate(180deg) scale(.85)}

.msgp{white-space:pre-wrap;background:var(--in);border-radius:16px;padding:12px 14px;margin-top:10px;font-size:14px;line-height:1.65}
/* ===== v3: iOS-style liquid glass, tuned for light & dark ===== */
:root{
  --lg-fill:linear-gradient(160deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.28) 46%,rgba(255,255,255,.18) 100%);
  --lg-rim:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.35),inset -1px 0 0 rgba(255,255,255,.2);
  --lg-shadow:0 18px 50px -18px rgba(50,30,100,.28),0 2px 6px rgba(50,30,100,.06);
  --lg-blur:blur(32px) saturate(200%) brightness(1.06);
  --lg-well:inset 0 2px 6px rgba(60,40,110,.10),inset 0 0 0 1px rgba(255,255,255,.55);

function list(){const L=$('#ol');if(!L)return;const n=(...k)=>orders.filter(o=>k.includes(o.status)).length;const sales=orders.filter(x=>x.status!=='cancelled').reduce((s,x)=>s+(+x.total||0),0);$('#sr').innerHTML=`<div class="sales"><div><small>মোট বিক্রি</small><b data-n="${sales}" data-tk="1">${tk(sales)}</b></div><span>${orders.length} অর্ডার</span></div><div class="stats"><div><b data-n="${n('new')}">${n('new')}</b><small>নতুন</small></div><div><b data-n="${n('confirmed','courier')}">${n('confirmed','courier')}</b><small>চলমান</small></div><div><b data-n="${n('delivered')}">${n('delivered')}</b><small>ডেলিভারি সম্পন্ন</small></div></div>`;countUp($('#sr'));const r=orders.filter(o=>filt==='all'||o.status===filt);

 <label>আইটেম</label>${o.items.map((i,k)=>`<div class="item" data-k="${k}"><input data-f="name" placeholder="নাম" value="${esc(i.name)}"><div class="row"><input data-f="price" type="number" placeholder="দাম" value="${i.price}"><input data-f="qty" type="number" placeholder="পরিমাণ" value="${i.qty}"></div><div class="row"><input data-f="size" placeholder="সাইজ" value="${esc(i.size||'')}"><input data-f="colour" placeholder="কালার" value="${esc(i.colour||'')}"></div>

 <div class="row"><div><label>অ্যাডভান্স পেয়েছি (৳)</label><input id="ev" type="number" value="${o.advance||0}"></div><div><label>পেমেন্ট মাধ্যম</label><select id="em2">${['bKash','Nagad','Cash'].map(x=>`<option ${o.method===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <div class="row"><div><label>নাম্বারের শেষ ডিজিট</label><input id="el" maxlength="4" value="${esc(o.senderLast||'')}"></div><div><label>TrxID</label><input id="ex" value="${esc(o.trxId||'')}"></div></div>
 <label>নোট</label><input id="eo" value="${esc(o.note||'')}"><button class="btn main" id="sv">${nw?'অর্ডার তৈরি করুন':'সেভ করুন'}</button><button class="btn s wide" id="cc">বাতিল</button>`;
